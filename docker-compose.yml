services:
  web-resume:
    build:
      context: .
      dockerfile: dockerfile
    image: web-resume:latest
    container_name: web-resume
    restart: unless-stopped
    command: >
      /bin/sh -c "update-ca-certificates &&
      nginx -g 'daemon off;'"
    ports:
      - "8080:80"
    volumes:
      - /usr/local/share/ca-certificates/caddy-root.crt:/usr/local/share/ca-certificates/caddy-root.crt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
